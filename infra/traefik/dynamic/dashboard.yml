# Exposes the Traefik dashboard at https://traefik.<ROOT_DOMAIN>/ behind
# HTTP basic auth. Credentials are read from dashboard-users.htpasswd, mounted
# by docker-compose at /etc/traefik/dynamic/dashboard-users.htpasswd.
http:
  routers:
    traefik-dashboard:
      rule: "Host(`{{ env "TRAEFIK_DASHBOARD_HOST" }}`)"
      service: api@internal
      entryPoints:
        - websecure
      tls:
        certResolver: dnswildcard
      middlewares:
        - dashboard-auth
  middlewares:
    dashboard-auth:
      basicAuth:
        usersFile: /etc/traefik/dynamic/dashboard-users.htpasswd
