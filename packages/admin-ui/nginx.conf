server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Keep admin-ui and API on the same origin for both localhost and FQDN
  # access. This avoids mixed host builds (e.g. localhost API in production
  # hostnames) and keeps cookie auth straightforward.
  location /api/ {
    proxy_pass http://orchestrator:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback — client-side router handles the actual route.
  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
}
